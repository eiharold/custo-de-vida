<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="16" y1="12" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3E4"/>
      <stop offset="1" stop-color="#F5E7D3"/>
    </linearGradient>
    <linearGradient id="skin" x1="32" y1="28" x2="64" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD8BF"/>
      <stop offset="1" stop-color="#F2B89C"/>
    </linearGradient>
    <linearGradient id="hair" x1="21" y1="15" x2="72" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F48A3A"/>
      <stop offset="1" stop-color="#C95A1A"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="84" height="84" rx="24" fill="url(#bg)"/>
  <circle cx="48" cy="50" r="24" fill="url(#skin)"/>

  <!-- Ears -->
  <circle cx="25.5" cy="50" r="5" fill="#F0B597"/>
  <circle cx="70.5" cy="50" r="5" fill="#F0B597"/>

  <!-- Curly hair -->
  <g fill="url(#hair)">
    <circle cx="31" cy="31" r="9"/>
    <circle cx="40" cy="24" r="10"/>
    <circle cx="52" cy="22.5" r="10.5"/>
    <circle cx="63" cy="26" r="9.5"/>
    <circle cx="69" cy="35" r="8"/>
    <circle cx="25" cy="39" r="7.5"/>
    <circle cx="72" cy="43" r="5.5"/>
    <path d="M25 42c3-14 13-24 24-24s22 7 25 23c-8-4-16-5-25-5-9 0-17 2-24 6Z"/>
  </g>

  <!-- Brows -->
  <path d="M34 43c2-2 6-3 10-2" stroke="#8A4A2A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M53 42c3-2 6-2 9 0" stroke="#8A4A2A" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="39.5" cy="49" r="2.5" fill="#3F2A20"/>
  <path d="M54.5 49.5c2.2 2 5.8 2 8 0" stroke="#3F2A20" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M49 49.5c0 3 1.2 4.5 2.8 5" stroke="#D79274" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M38 60c3 4 15 4 19 0" stroke="#8F4A34" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="32" cy="56" rx="4" ry="2.4" fill="#F1A6A0" opacity=".45"/>
  <ellipse cx="64" cy="56" rx="4" ry="2.4" fill="#F1A6A0" opacity=".45"/>

  <!-- Shoulder hint -->
  <path d="M26 83c2-9 11-15 22-15s20 6 22 15" fill="#D9E7F8" opacity=".9"/>

  <!-- 3D soft shine -->
  <circle cx="33" cy="22" r="10" fill="#fff" opacity=".10"/>
</svg>
